events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Excel MIME types
  types {
    application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
    application/vnd.ms-excel xls;
  }

  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Basic rate limit for API proxy
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  
  # Large header buffer for Excel downloads
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      # Con "proxy_pass http://backend:4000" fijo, nginx resuelve el hostname una
      # sola vez al arrancar y cachea esa IP. Cada deploy recrea el contenedor del
      # backend con IP nueva, asi que nginx puede quedar apuntando a una direccion
      # muerta con todos los contenedores en healthy. Resolviendo por request
      # contra el DNS interno de Docker (127.0.0.11) eso no vuelve a pasar.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $backend_api backend;
      proxy_pass http://$backend_api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
    }

    location /health {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $backend_health backend;
      proxy_pass http://$backend_health:4000/health;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

