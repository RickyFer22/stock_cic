events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Excel MIME types
  types {
    application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
    application/vnd.ms-excel xls;
  }

  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Basic rate limit for API proxy
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  
  # Large header buffer for Excel downloads
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # El sitio se servia sin comprimir: ~1,1 MB de JS en la primera carga. Los
    # assets llevan hash en el nombre, asi que comprimirlos no tiene riesgo de
    # servir version vieja.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
      text/plain text/css text/xml
      application/javascript application/json
      application/xml application/xml+rss
      image/svg+xml;

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      # Con "proxy_pass http://backend:4000" fijo, nginx resuelve el hostname una
      # sola vez al arrancar y cachea esa IP. Cada deploy recrea el contenedor del
      # backend con IP nueva, asi que nginx puede quedar apuntando a una direccion
      # muerta con todos los contenedores en healthy. Resolviendo por request
      # contra el DNS interno de Docker (127.0.0.11) eso no vuelve a pasar.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $backend_api backend;
      proxy_pass http://$backend_api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
    }

    location /health {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $backend_health backend;
      proxy_pass http://$backend_health:4000/health;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Los assets llevan hash en el nombre: si el contenido cambia, cambia la URL.
    # Se pueden cachear para siempre sin riesgo de servir una version vieja.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # index.html NO. Es el unico archivo con nombre fijo y es el que apunta a los
    # assets con hash, asi que cachearlo deja al navegador anclado al bundle
    # viejo. Se servia sin ninguna cabecera de cache: solo con ETag el navegador
    # aplica cache heuristica y puede no revalidar durante horas. Resultado: se
    # despliega una version nueva y quien ya habia entrado sigue viendo la vieja,
    # que es como el tema oscuro parecia "no funcionar" estando ya corregido.
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

